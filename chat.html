<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI University Counselor</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for running JSX in a single HTML file -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-fuchsia-600 via-purple-600 to-pink-500 font-sans antialiased min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div id="root" class="w-full max-w-3xl h-[90vh] max-h-[850px]"></div>

  <script type="text/babel">
    // IMPORTANT: In Production, replace localhost with your live n8n host or keep localhost if testing locally
    // Change 'webhook-test' to 'webhook' if n8n Workflow is set to ACTIVE!
    const N8N_WEBHOOK_URL = "http://localhost:5678/webhook/university-counselor-chat";

    function App() {
      const [messages, setMessages] = React.useState([
        {
          id: '1',
          sender: 'bot',
          text: 'Hello! I am your AI University Admission & Career Counselor.\n\nAsk me anything about degree roadmaps, semester fee structures, academic requirements, or request a prospectus kit sent to your email!',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      const [input, setInput] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [sessionId, setSessionId] = React.useState('');
      const chatEndRef = React.useRef(null);

      React.useEffect(() => {
        let currentSession = localStorage.getItem('uni_counselor_session');
        if (!currentSession) {
          currentSession = 'session-' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('uni_counselor_session', currentSession);
        }
        setSessionId(currentSession);
      }, []);

      React.useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading) return;

        const currentInput = input.trim();
        const userMsg = {
          id: Date.now().toString(),
          sender: 'user',
          text: currentInput,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages((prev) => [...prev, userMsg]);
        setInput('');
        setLoading(true);

        try {
          const response = await fetch(N8N_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              session_id: sessionId,
              user_id: 'web-student',
              user_message: currentInput
            })
          });

          if (!response.ok) {
            throw new Error(`Server returned status ${response.status}`);
          }

          const data = await response.json();

          const botMsg = {
            id: (Date.now() + 1).toString(),
            sender: 'bot',
            text: data.reply || data.output || 'Request processed successfully!',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages((prev) => [...prev, botMsg]);
        } catch (err) {
          console.error("Webhook Error:", err);
          setMessages((prev) => [
            ...prev,
            {
              id: (Date.now() + 1).toString(),
              sender: 'bot',
              text: 'Could not connect to n8n backend. Please ensure:\n1. n8n Workflow is ACTIVE.\n2. Webhook URL is correct.\n3. CORS is permitted on the webhook response.',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]);
        } finally {
          // Input Box hamesha re-enable hoga agle question ke liye
          setLoading(false);
        }
      };

      const handleNewSession = () => {
        const newSession = 'session-' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('uni_counselor_session', newSession);
        setSessionId(newSession);
        setMessages([
          {
            id: '1',
            sender: 'bot',
            text: 'New session started. How can I assist you with admissions today?',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }
        ]);
      };

      return (
        <div className="flex h-full w-full flex-col overflow-hidden rounded-3xl bg-slate-900/80 backdrop-blur-xl shadow-2xl border border-white/20">
          
          {/* Header */}
          <div className="flex items-center justify-between bg-gradient-to-r from-violet-600 via-pink-600 to-amber-500 px-6 py-4 text-white shadow-lg">
            <div className="flex items-center gap-3">
              <div className="flex h-10 w-10 items-center justify-center rounded-full bg-white/20 backdrop-blur-md text-xl shadow-inner">
                <i className="fa-solid fa-graduation-cap"></i>
              </div>
              <div>
                <h1 className="text-base font-bold tracking-wide">AI University Counselor</h1>
                <p className="text-xs text-pink-100 flex items-center gap-1.5 font-medium">
                  <span className="h-2.5 w-2.5 rounded-full bg-emerald-400 inline-block animate-pulse shadow-[0_0_8px_#34d399]"></span> RAG System Active
                </p>
              </div>
            </div>

            <button 
              onClick={handleNewSession}
              className="flex items-center gap-2 rounded-xl bg-white/20 px-3.5 py-1.5 text-xs font-semibold text-white transition hover:bg-white/30 backdrop-blur-md active:scale-95"
            >
              <i className="fa-solid fa-arrows-rotate"></i>
              <span className="hidden sm:inline">Reset Session</span>
            </button>
          </div>

          {/* Chat Messages Body */}
          <div className="flex-1 overflow-y-auto bg-slate-950/40 p-4 sm:p-6 space-y-4">
            {messages.map((msg) => (
              <div 
                key={msg.id} 
                className={`flex gap-3 ${msg.sender === 'user' ? 'flex-row-reverse' : 'flex-row'}`}
              >
                {/* Avatar */}
                <div className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xs text-white shadow-md ${
                  msg.sender === 'user' 
                    ? 'bg-gradient-to-tr from-pink-500 to-rose-500' 
                    : 'bg-gradient-to-tr from-violet-600 to-indigo-600'
                }`}>
                  <i className={msg.sender === 'user' ? "fa-solid fa-user" : "fa-solid fa-robot"}></i>
                </div>

                {/* Bubble */}
                <div className={`relative max-w-[80%] rounded-2xl px-4 py-3 shadow-lg backdrop-blur-md ${
                  msg.sender === 'user' 
                    ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-tr-none' 
                    : 'bg-slate-800/90 text-slate-100 border border-slate-700 rounded-tl-none'
                }`}>
                  <p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                  <span className={`mt-1.5 block text-[10px] ${
                    msg.sender === 'user' ? 'text-pink-100 text-right' : 'text-slate-400'
                  }`}>
                    {msg.time}
                  </span>
                </div>
              </div>
            ))}

            {/* Typing Indicator */}
            {loading && (
              <div className="flex gap-3 items-center">
                <div className="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-tr from-violet-600 to-indigo-600 text-xs text-white shadow-md">
                  <i className="fa-solid fa-robot"></i>
                </div>
                <div className="rounded-2xl bg-slate-800/90 border border-slate-700 px-4 py-3 shadow-lg flex items-center gap-3">
                  <i className="fa-solid fa-circle-notch animate-spin text-pink-500 text-sm"></i>
                  <span className="text-xs font-semibold text-slate-300">Searching university database...</span>
                </div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          {/* Input Footer */}
          <form onSubmit={handleSend} className="border-t border-slate-800 bg-slate-900/90 p-4">
            <div className="flex items-center gap-3">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                disabled={loading}
                placeholder={loading ? "Waiting for counselor response..." : "Ask about fees, courses, or email prospectus..."}
                className="flex-1 rounded-xl bg-slate-800/80 border border-slate-700 px-4 py-3 text-sm text-white placeholder-slate-400 outline-none transition focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 disabled:opacity-50"
              />
              <button
                type="submit"
                disabled={loading || !input.trim()}
                className="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white font-bold shadow-lg shadow-pink-500/25 transition hover:brightness-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:brightness-100"
              >
                <i className="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </form>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
